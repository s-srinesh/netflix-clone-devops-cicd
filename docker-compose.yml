services:
  # ==========================================
  # Backend API Service (Node.js + Express)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netflix-backend
    restart: always
    stop_grace_period: 3s
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - SERVER_PORT=${SERVER_PORT:-8000}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-postgres}
      - DB_SSL=${DB_SSL:-true}
      - JWT_SECRET=${JWT_SECRET}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - MAILTRAP_TOKEN=${MAILTRAP_TOKEN}
      - MAILTRAP_ENDPOINT=${MAILTRAP_ENDPOINT}
      - CLIENT_URL=${CLIENT_URL:-http://localhost}
    ports:
      - "${SERVER_PORT:-8000}:8000"
    networks:
      - netflix-network

  # ==========================================
  # Frontend Service (React + Vite + Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netflix-frontend
    restart: always
    stop_grace_period: 3s
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend
    networks:
      - netflix-network

networks:
  netflix-network:
    driver: bridge
